name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # `build` runs `tsc -p tsconfig.json && vite build` — the real gate.
      - run: npm run build
      # Lint is informational for now (codebase predates CI linting).
      - run: npm run lint
        continue-on-error: true

  backend:
    name: Backend (compile + import smoke + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_readar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Byte-compile everything (catches syntax errors across app/ + scripts/).
      - run: python -m compileall -q app
      # Import the app graph (catches bad imports / missing symbols). Engine is
      # created lazily with pool_pre_ping, so this does not hit the database.
      - run: python -c "import app.main"
        env:
          # Non-placeholder dummy (config rejects the default); engine is lazy so no connection is made.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/readar_ci
      # Run the pytest suite against the Postgres service. conftest builds the
      # schema via create_all and isolates each test in a rolled-back transaction.
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/test_readar
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/test_readar
      # Verify the documented refresh against two disposable CI databases.
      # This also catches migration-from-empty failures hidden by create_all.
      - name: Verify catalog refresh from an empty database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: postgres
        run: |
          createdb readar_refresh_source
          createdb readar_refresh_copy
          DATABASE_URL=postgresql://ci:ci@localhost:5432/readar_refresh_source python -m alembic upgrade head
          DATABASE_URL=postgresql://ci:ci@localhost:5432/readar_refresh_copy python -m alembic upgrade head
          psql --dbname=readar_refresh_source -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO books (id, title, author_name, description, knowledge_level, functional_tags, core_frameworks)
          VALUES ('00000000-0000-0000-0000-000000000028', 'Synthetic refresh fixture', 'Fixture Author', 'Not a production catalog', 2, ARRAY['marketing'], '["Referral system"]');
          INSERT INTO book_sources (id, book_id, source_name, source_year, source_rank, source_category, created_at, updated_at)
          VALUES ('00000000-0000-0000-0000-000000000029', '00000000-0000-0000-0000-000000000028', 'synthetic', 2026, 1, 'business', NOW(), NOW());
          SQL
          READAR_BASELINE_DATABASE_URL=postgresql://ci:ci@localhost:5432/readar_refresh_source python scripts/catalog_baseline.py snapshot --label ci-source --output /tmp/readar-source.json
          PGOPTIONS='-c default_transaction_read_only=on' pg_dump --dbname=readar_refresh_source --format=custom --data-only --no-owner --no-acl --table=public.books --table=public.book_sources --file=/tmp/readar-catalog.dump
          pg_restore --dbname=readar_refresh_copy --data-only --no-owner --no-acl --single-transaction --exit-on-error /tmp/readar-catalog.dump
          READAR_BASELINE_DATABASE_URL=postgresql://ci:ci@localhost:5432/readar_refresh_copy python scripts/catalog_baseline.py snapshot --label ci-copy --output /tmp/readar-copy.json
          python scripts/catalog_baseline.py compare /tmp/readar-source.json /tmp/readar-copy.json
